services:
  backend:
    build:
      context: .
      dockerfile: codebase/backend/Dockerfile
    container_name: aurafarming-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - WEB_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:8000
    volumes:
      - ./var:/app/var
      - ./traces:/app/traces
    restart: unless-stopped

  frontend:
    build:
      context: ./codebase/web
      dockerfile: Dockerfile
    container_name: aurafarming-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
