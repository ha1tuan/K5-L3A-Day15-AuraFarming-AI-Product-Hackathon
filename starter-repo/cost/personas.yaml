# Mô phỏng chi phí khi dùng thật — AuraFarming (lập kế hoạch + soát báo giá chuyến đi công ty).
# Mọi số có nguồn hoặc ghi rõ "(tự ước tính)". Chạy: python run.py simulate --rate-from eval/run-2.csv

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người tổ chức chuyến đi DÙNG sản phẩm / tháng — 3 kịch bản
  low: 430          # 0,5% của ~85.900 người tổ chức chuyến đi công ty
  base: 1720        # 2%
  high: 8590        # 10%
  source: "Tổng ~85.900 người tổ chức = 10% của 859.048 doanh nghiệp đang hoạt động cuối 2025 (Cục Thống kê, sơ bộ Tổng điều tra kinh tế 2026, https://www.vietnamplus.vn/ca-nuoc-co-859048-doanh-nghiep-dang-hoat-dong-san-xuat-kinh-doanh-post1123945.vnp; tỉ lệ 10% (tự ước tính), spec.md §2). Tỉ lệ dùng sản phẩm 0,5% / 2% / 10%: (tự ước tính)"

personas:           # ≥3 kiểu người dùng; share cộng lại = 1 — spec.md §2 "Số lần / tháng của từng kiểu người dùng"
  - name: giam_doc_cty_nho        # giám đốc / trưởng phòng công ty 20–50 người tự lo chuyến đi
    share: 0.5
    uses_per_month: 0.5           # 2 chuyến / năm × 3 bản dự trù / chuyến ÷ 12 tháng
    turns_per_session: 2          # 1 yêu cầu + 1 lần sửa (đổi ngân sách / địa điểm)
    source: "spec.md §2 — 2 chuyến / năm, 2–3 bản dự trù mỗi chuyến (tự ước tính, chờ phỏng vấn evidence/interviews/CAU_HOI.md câu 13)"
  - name: hr_admin                # HR / admin công ty 50–200 người, thêm chuyến phòng ban, soát báo giá tour
    share: 0.35
    uses_per_month: 1.0           # ~3 chuyến / năm × 4 lần dùng (dự trù + soát báo giá) ÷ 12
    turns_per_session: 3
    source: "spec.md §2 — 0,2–0,3 chuyến / tháng, 3–5 bản mỗi chuyến (tự ước tính, chờ phỏng vấn)"
  - name: to_chuc_thuong_xuyen    # công ty lớn nhiều phòng ban / người phụ trách sự kiện nội bộ
    share: 0.15
    uses_per_month: 4
    turns_per_session: 4
    source: "(tự ước tính) — nhiều đoàn phòng ban / tháng, so nhiều báo giá; chờ phỏng vấn"
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho) — gồm cả câu soát báo giá Q01–Q12.

prices:             # USD / 1 triệu token — further-reading/model-prices.md của repo đề (BTC tra 25/11/2026)
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · bảng giá K5 (further-reading/model-prices.md) · xem 25/11/2026 · tầng Nhỏ"
  - model: gpt-5.4-mini
    input: 0.75
    output: 4.50
    source: "https://developers.openai.com/api/docs/pricing · bảng giá K5 · xem 25/11/2026 · tầng Nhỏ — model nhóm định dùng (spec.md §10)"
  - model: claude-sonnet-5.5
    input: 2.00
    output: 10.00
    source: "https://platform.claude.com/docs/en/about-claude/pricing · bảng giá K5 · xem 25/11/2026 · tầng Lớn"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
